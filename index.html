<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>HD Camera & Zoom Gallery</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .viewfinder {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas { display: none; }
        
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 110px;
            background: rgba(0, 0, 0, 0.9);
            padding: 0 20px;
        }
        .capture-btn {
            width: 70px;
            height: 70px;
            background: #fff;
            border: 4px solid #888;
            border-radius: 50%;
            cursor: pointer;
            outline: none;
        }
        .capture-btn:active { transform: scale(0.92); }
        .gallery-btn {
            width: 50px;
            height: 50px;
            background: #222;
            border: 2px solid #fff;
            border-radius: 10px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
        }

        /* Gallery Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #111;
        }
        .close-btn {
            background: #ff4757;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 16px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            padding: 10px;
            overflow-y: auto;
            flex: 1;
        }
        .gallery-grid img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Fullscreen Zoom View */
        .zoom-view {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }
        .zoom-view img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.2s ease;
        }
        .close-zoom {
            position: absolute;
            top: 20px; right: 20px;
            background: #fff; color: #000;
            border: none; border-radius: 50%;
            width: 40px; height: 40px;
            font-weight: bold; font-size: 18px;
            z-index: 2100;
        }
    </style>
</head>
<body>

    <div class="viewfinder">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
        <div style="width:50px;"></div>
        <button class="capture-btn" id="capture"></button>
        <div class="gallery-btn" id="galleryBtn"></div>
    </div>

    <!-- Modal Gallery -->
    <div class="modal" id="galleryModal">
        <div class="modal-header">
            <h3>Aapki Photos</h3>
            <button class="close-btn" id="closeModal">Close</button>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- Zoom Viewer -->
    <div class="zoom-view" id="zoomView">
        <button class="close-zoom" id="closeZoom">✕</button>
        <img id="fullImage" src="" alt="Zoomed Photo">
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture');
        const galleryBtn = document.getElementById('galleryBtn');
        const galleryModal = document.getElementById('galleryModal');
        const closeModal = document.getElementById('closeModal');
        const galleryGrid = document.getElementById('galleryGrid');
        const zoomView = document.getElementById('zoomView');
        const fullImage = document.getElementById('fullImage');
        const closeZoom = document.getElementById('closeZoom');

        let photos = [];

        // Camera Initialization
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (e) {
                alert("Camera error: Chrome site settings me jaakar Camera Permission ALLOW karein!");
            }
        }
        startCamera();

        // Capture & Process
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Sharpening / Contrast Enhancement
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                d[i] = d[i] < 128 ? d[i] * 0.92 : d[i] * 1.08;
                d[i+1] = d[i+1] < 128 ? d[i+1] * 0.92 : d[i+1] * 1.08;
                d[i+2] = d[i+2] < 128 ? d[i+2] * 0.92 : d[i+2] * 1.08;
            }
            ctx.putImageData(imgData, 0, 0);

            const url = canvas.toDataURL('image/jpeg', 0.95);
            photos.unshift(url);
            galleryBtn.style.backgroundImage = `url(${url})`;
        });

        // Open Gallery Modal
        galleryBtn.addEventListener('click', () => {
            if(photos.length === 0) return alert("Pehle photo khichein!");
            galleryGrid.innerHTML = '';
            photos.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                img.onclick = () => openZoom(src);
                galleryGrid.appendChild(img);
            });
            galleryModal.style.display = 'flex';
        });

        closeModal.addEventListener('click', () => galleryModal.style.display = 'none');

        // Zoom View
        function openZoom(src) {
            fullImage.src = src;
            zoomView.style.display = 'flex';
        }
        closeZoom.addEventListener('click', () => zoomView.style.display = 'none');
    </script>
</body>
</html>
