<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HD Camera & Gallery App</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .viewfinder {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            overflow: hidden;
        }
        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* GPU acceleration ke liye */
            transform: translateZ(0); 
        }
        canvas {
            display: none;
        }
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.8);
            position: absolute;
            bottom: 0;
        }
        .capture-btn {
            width: 75px;
            height: 75px;
            background: #fff;
            border: 4px solid #ccc;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .capture-btn:active {
            transform: scale(0.9);
        }
        .gallery-btn {
            width: 50px;
            height: 50px;
            background: #333;
            border: 2px solid #fff;
            border-radius: 10px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
        }
        .processing-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fffa65;
        }
    </style>
</head>
<body>

    <div class="viewfinder">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <div id="processing" class="processing-overlay">AI Processing & Sharpening...</div>
    </div>

    <div class="controls">
        <div style="width: 50px;"></div> <!-- Spacer -->
        <button class="capture-btn" id="capture"></button>
        <div class="gallery-btn" id="galleryBtn" title="Gallery"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture');
        const galleryBtn = document.getElementById('galleryBtn');
        const processingOverlay = document.getElementById('processing');

        let galleryImages = [];

        // Camera start karein (Back camera preference ke sath)
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Camera access error: " + err);
            }
        }
        initCamera();

        // Photo khichne aur processing (Sharpening / GPU Filter) karne ka function
        captureBtn.addEventListener('click', () => {
            processingOverlay.style.display = 'flex';

            setTimeout(() => {
                canvas.width = video.videoWidth || 1280;
                canvas.height = video.videoHeight || 720;
                const ctx = canvas.getContext('2d');

                // Video frame ko canvas par draw karein
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Image processing: Contrast aur Sharpening effect apply karna taaki photo saaf dikhe
                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = imgData.data;
                
                // Simple high-contrast / clarity enhancement algorithm
                for (let i = 0; i < data.length; i += 4) {
                    // Contrast boost
                    data[i] = data[i] < 128 ? data[i] * 0.95 : data[i] * 1.05;     // Red
                    data[i+1] = data[i+1] < 128 ? data[i+1] * 0.95 : data[i+1] * 1.05; // Green
                    data[i+2] = data[i+2] < 128 ? data[i+2] * 0.95 : data[i+2] * 1.05; // Blue
                }
                ctx.putImageData(imgData, 0, 0);

                // Image ko URL mein badal kar gallery array mein save karein
                const imageUrl = canvas.toDataURL('image/jpeg', 0.95);
                galleryImages.push(imageUrl);

                // Gallery button ka thumbnail update karein
                galleryBtn.style.backgroundImage = `url(${imageUrl})`;

                processingOverlay.style.display = 'none';
            }, 400); // 400ms ka artificial processing delay realistic feel ke liye
        });

        // Gallery kholne ka feature
        galleryBtn.addEventListener('click', () => {
            if (galleryImages.length === 0) {
                alert("Gallery khali hai! Pehle ek photo khichein.");
                return;
            }
            // Ek naye tab ya window mein gallery ki latest photo dikhana
            let win = window.open("");
            win.document.write("<h2>Aapki Gallery</h2><div style='display:flex;flex-wrap:wrap;gap:10px;'>");
            galleryImages.forEach(img => {
                win.document.write(`<img src="${img}" style="width:200px;border-radius:8px;border:2px solid #fff;" />`);
            });
            win.document.write("</div>");
        });
    </script>
</body>
</html>
